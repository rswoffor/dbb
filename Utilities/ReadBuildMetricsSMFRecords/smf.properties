#
# Default properties used by the readSMF script
# Please provide values for hlq and for either datasets or logstreams, or use command line arguments
#

# High Level qualifier for working dataset
hlq=

# SMF record type (122) or range of record types 0:255...defaults to 122
recordType=122

# SMF datasets, a comma separated list, as defined in SYS1.PARMLIB(SMFPRMxx) DSNAME option
# Use this when SMF records are recorded to SMF datasets (SMFPRMxx RECORDING(DATASET))
datasets=SYS1.MAN1,SYS1.MAN2,SYS1.MAN3

# SMF log streams, a comma separated list, as defined in SYS1.PARMLIB(SMFPRMxx) LSNAME option
# Use this when SMF records are recorded to log streams (SMFPRMxx RECORDING(LOGSTREAM))
# When logstreams is specified, it is used instead of datasets
logstreams=

# Set to true to write the build metrics as JSON (SMFReport.json) instead of an HTML table (SMFReport.html)
outputJson=false
